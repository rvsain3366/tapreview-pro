<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TapReview Pro - 4x6 Print Card</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #ffffff;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }
    .panel {
      width: 100%;
      max-width: 400px;
      background: #1e293b;
      border: 1px solid #334155;
      padding: 24px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .badge {
      display: inline-block;
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 99px;
      margin-bottom: 12px;
    }
    h2 { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
    .sub { font-size: 12px; color: #94a3b8; margin-bottom: 18px; }
    label { display: block; font-size: 12px; font-weight: 700; color: #cbd5e1; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      background: #0f172a;
      border: 1px solid #475569;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 14px;
      outline: none;
    }
    input:focus { border-color: #fbbf24; }
    .btn-download {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(90deg, #fbbf24, #eab308);
      color: #09132c;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(234, 179, 8, 0.3);
    }
    .btn-download:active { transform: scale(0.98); }
    .note { font-size: 11px; color: #94a3b8; text-align: center; margin-top: 10px; }
    .preview-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      width: 340px;
      height: 510px;
      border-radius: 24px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.75);
    }
  </style>
</head>
<body>

  <div class="panel">
    <span class="badge">Admin Card Studio • 4x6 Inch</span>
    <h2>प्रिंट कार्ड डिजाइन तैयार करें</h2>
    <p class="sub">नाम और लिंक लिखें, नीचे कार्ड और QR कोड तुरंत बन जाएगा।</p>

    <label>दुकान या व्यक्ति का नाम (Shop / Personal Name)</label>
    <input type="text" id="inputName" value="Keshav Atal Sewa Kendra" oninput="drawCard()" placeholder="नाम लिखें..." />

    <label>जनरेट किया गया NFC / Review लिंक (QR के लिए)</label>
    <input type="text" id="inputLink" value="https://vercel.app" oninput="drawCard()" placeholder="https://..." />

    <button class="btn-download" onclick="downloadPNG()">⬇️ Download 4x6 Print Design (PNG)</button>
    <p class="note" id="statusMsg">हाई-क्वालिटी (1200x1800 px) फाइल सीधे फोन में डाउनलोड होगी।</p>
  </div>

  <div class="preview-wrap">
    <canvas id="cardCanvas" width="1200" height="1800"></canvas>
  </div>

  <script>
    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawCard() {
      const canvas = document.getElementById("cardCanvas");
      const ctx = canvas.getContext("2d");
      const W = 1200, H = 1800;

      const shopName = document.getElementById("inputName").value.trim() || "Your Shop Name";
      const linkUrl = document.getElementById("inputLink").value.trim() || "https://vercel.app";

      ctx.clearRect(0, 0, W, H);

      ctx.save();
      roundRect(ctx, 10, 10, W - 20, H - 20, 84);
      ctx.clip();

      const bgGrad = ctx.createRadialGradient(W/2, H*0.25, 80, W/2, H*0.5, 1100);
      bgGrad.addColorStop(0, "#19326b");
      bgGrad.addColorStop(0.7, "#09132c");
      bgGrad.addColorStop(1, "#040917");
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, W, H);

      ctx.strokeStyle = "rgba(234, 179, 8, 0.10)";
      ctx.lineWidth = 3;
      for (let i = -H; i < W + H; i += 140) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + H, H); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(i, H); ctx.lineTo(i + H, 0); ctx.stroke();
      }
      ctx.restore();

      roundRect(ctx, 14, 14, W - 28, H - 28, 80);
      ctx.strokeStyle = "rgba(250, 204, 21, 0.55)";
      ctx.lineWidth = 8;
      ctx.stroke();

      ctx.save();
      ctx.strokeStyle = "#fbbf24";
      ctx.lineWidth = 10;
      ctx.lineCap = "round";
      const wx = 355, wy = 165;
      const waves = new Array(35, 55, 75, 95);
      for (let i = 0; i < waves.length; i++) {
        ctx.beginPath();
        ctx.arc(wx, wy, waves[i], -0.65, 0.65);
        ctx.stroke();
      }

      const goldGrad = ctx.createLinearGradient(0, 110, 0, 210);
      goldGrad.addColorStop(0, "#fef08a");
      goldGrad.addColorStop(0.5, "#eab308");
      goldGrad.addColorStop(1, "#ca8a04");
      ctx.fillStyle = goldGrad;
      ctx.font = "800 92px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("Tap Here", 470, 195);
      ctx.restore();

      ctx.font = "800 54px sans-serif";
      if (ctx.measureText(shopName).width > 960) {
        ctx.font = "800 42px sans-serif";
      }
      const textW = Math.min(ctx.measureText(shopName).width + 110, 1060);
      roundRect(ctx, (W - textW)/2, 255, textW, 105, 52);
      ctx.fillStyle = "rgba(251, 191, 36, 0.16)";
      ctx.fill();
      ctx.strokeStyle = "rgba(251, 191, 36, 0.55)";
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center";
      ctx.fillText(shopName, W/2, 326, 1000);

      ctx.fillStyle = "#fbbf24";
      ctx.font = "76px sans-serif";
      ctx.fillText("★  ★  ★  ★  ★", W/2, 465);

      ctx.fillStyle = "#fef3c7";
      ctx.font = "700 44px sans-serif";
      ctx.fillText("आपका एक लाईक और कमेंट", W/2, 545);
      ctx.fillText("हमे और बेहतर बनाता है", W/2, 605);

      const boxSize = 620;
      const boxX = (W - boxSize)/2;
      const boxY = 670;
      roundRect(ctx, boxX, boxY, boxSize, boxSize + 75, 48);
      ctx.fillStyle = "#ffffff";
      ctx.fill();
      ctx.strokeStyle = "#fde047";
      ctx.lineWidth = 8;
      ctx.stroke();

      if (typeof qrcode !== "undefined") {
        const qr = qrcode(0, "H");
        qr.addData(linkUrl);
        qr.make();
        const count = qr.getModuleCount();
        const qrDrawSize = 520;
        const cell = qrDrawSize / count;
        const startX = boxX + (boxSize - qrDrawSize)/2;
        const startY = boxY + 45;

        ctx.fillStyle = "#09132c";
        for (let r = 0; r < count; r++) {
          for (let c = 0; c < count; c++) {
            if (qr.isDark(r, c)) {
              ctx.fillRect(startX + c * cell, startY + r * cell, Math.ceil(cell), Math.ceil(cell));
            }
          }
        }
      }

      ctx.fillStyle = "#0f172a";
      ctx.font = "800 32px sans-serif";
      ctx.fillText("Scan or Tap to Connect", W/2, boxY + boxSize + 36);

      const iconY = 1485;
      ctx.beginPath(); ctx.arc(280, iconY, 54, 0, Math.PI*2); ctx.fillStyle = "#ffffff"; ctx.fill();
      ctx.fillStyle = "#4285F4"; ctx.font = "900 58px sans-serif"; ctx.fillText("G", 280, iconY + 20);
      ctx.fillStyle = "#e2e8f0"; ctx.font = "700 28px sans-serif"; ctx.fillText("Google Review", 280, iconY + 95);

      const igGrad = ctx.createLinearGradient(546, iconY - 54, 654, iconY + 54);
      igGrad.addColorStop(0, "#f59e0b"); igGrad.addColorStop(0.5, "#db2777"); igGrad.addColorStop(1, "#7c3aed");
      roundRect(ctx, 546, iconY - 54, 108, 108, 28); ctx.fillStyle = igGrad; ctx.fill();
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 7;
      roundRect(ctx, 570, iconY - 30, 60, 60, 16); ctx.stroke();
      ctx.beginPath(); ctx.arc(600, iconY, 14, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = "#e2e8f0"; ctx.font = "700 28px sans-serif"; ctx.fillText("Instagram", 600, iconY + 95);

      ctx.beginPath(); ctx.arc(920, iconY, 54, 0, Math.PI*2); ctx.fillStyle = "#25D366"; ctx.fill();
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.arc(920, iconY - 2, 26, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = "#e2e8f0"; ctx.font = "700 28px sans-serif"; ctx.fillText("WhatsApp", 920, iconY + 95);

      ctx.strokeStyle = "rgba(251, 191, 36, 0.3)";
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(100, 1665); ctx.lineTo(W - 100, 1665); ctx.stroke();

      ctx.fillStyle = "#cbd5e1";
      ctx.font = "700 32px sans-serif";
      ctx.fillText("Powered by Ravkirkesh • TapReview Pro", W/2, 1725);
    }

    function downloadPNG() {
      const canvas = document.getElementById("cardCanvas");
      const shopName = document.getElementById("inputName").value.trim() || "TapReview-Card";
      const status = document.getElementById("statusMsg");
      status.innerText = "डाउनलोड तैयार हो रहा है...";

      canvas.toBlob(function(blob) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${shopName.replace(/\s+/g, "_")}_4x6_Print.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        status.innerText = "✅ डाउनलोड शुरू हो गया है! अपनी फोन गैलरी या Downloads में देखें।";
      }, "image/png");
    }

    window.onload = () => drawCard();
  </script>
</body>
</html>
